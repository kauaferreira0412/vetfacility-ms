spring:
  application:
    name: vetfacility

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vetfacility}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt:
      private-key: ${JWT_PRIVATE_KEY_PATH:classpath:certs/app.key}
      public-key: ${JWT_PUBLIC_KEY_PATH:classpath:certs/app.pub}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
      issuer: vetfacility

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  root:
    email: ${ROOT_EMAIL:root@vetfacility.local}
    password: ${ROOT_PASSWORD:TrocarSenha123!}

logging:
  level:
    com.br.vetfacility: INFO
