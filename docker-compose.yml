name: vetfacility-backend

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vetfacility}
      POSTGRES_USER: ${POSTGRES_USER:-vetfacility}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vetfacility}
    volumes:
      - vetfacility_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vetfacility}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vetfacility_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/vetfacility}
      DB_USERNAME: ${DB_USERNAME:-vetfacility}
      DB_PASSWORD: ${DB_PASSWORD:-vetfacility}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ROOT_EMAIL: ${ROOT_EMAIL:-root@vetfacility.local}
      ROOT_PASSWORD: ${ROOT_PASSWORD:-TrocarSenha123!}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vetfacility_net

volumes:
  vetfacility_pgdata:

networks:
  vetfacility_net:
    name: vetfacility_net
