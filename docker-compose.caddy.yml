# Overlay que adiciona um Caddy dedicado (HTTPS automático via Let's Encrypt) na frente do
# frontend, para uma VPS só do VetFacility (sem outro projeto/Caddy já rodando nela).
# Uso: docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.caddy.yml up -d --build

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - vetfacility_net

volumes:
  caddy_data:
  caddy_config:
